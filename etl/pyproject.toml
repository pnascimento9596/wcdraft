[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wcdraft-etl"
version = "0.0.0"
description = "ETL pipeline for wcdraft datasets. Empty skeleton in WS-0; no pipeline logic yet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wcdraft" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wcdraft_etl"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The 3.9 line changes 21 tracked files under the repository's current format
      # contract. Keep exact 3.8.4 until a dedicated formatting migration; 3.10+
      # remains eligible for an independently measured decision.
      - dependency-name: "prettier"
        versions: ["3.9.x"]
      # These majors were split out of the mixed root update and deliberately
      # retained at their existing compatibility boundaries. Future majors remain
      # eligible rather than being hidden by a blanket semver-major ignore.
      - dependency-name: "@types/node"
        versions: ["26.x"]
      - dependency-name: "typescript"
        versions: ["7.x"]
      - dependency-name: "zod"
        versions: ["4.x"]
      # These patches surfaced after the dependency-sweep baseline and belong to
      # the separately gated mobile lane. Exact-version ignores allow later fixes.
      - dependency-name: "@capacitor/core"
        versions: ["8.4.2"]
      - dependency-name: "@capacitor/ios"
        versions: ["8.4.2"]
      - dependency-name: "@capacitor/cli"
        versions: ["8.4.2"]
    groups:
      npm-workspace:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/core"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    groups:
      core:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/data"
    schedule:
      interval: "weekly"
    groups:
      data:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/db"
    schedule:
      interval: "weekly"
    groups:
      db:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/marketing/x"
    schedule:
      interval: "weekly"
    groups:
      marketing-x:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # v7 is an ESM major and was rejected after v6.5.0 shipped cleanly. Keep
      # later major lines eligible for a fresh compatibility decision.
      - dependency-name: "actions/setup-node"
        versions: [">= 7.0.0, < 8.0.0"]
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/etl"
    schedule:
      interval: "weekly"
    groups:
      etl:
        patterns:
          - "*"

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # 3.9.5 changes 21 tracked files under the repository's current format contract.
      # Keep the verified exact 3.8.4 pin until a dedicated formatting migration.
      - dependency-name: "prettier"
        versions: ["3.9.5"]
      # These patches surfaced after the dependency-sweep baseline and belong to
      # the separately gated mobile lane. Exact-version ignores allow later fixes.
      - dependency-name: "@capacitor/core"
        versions: ["8.4.2"]
      - dependency-name: "@capacitor/ios"
        versions: ["8.4.2"]
      - dependency-name: "@capacitor/cli"
        versions: ["8.4.2"]
    groups:
      npm-workspace:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/core"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    groups:
      core:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/data"
    schedule:
      interval: "weekly"
    groups:
      data:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/packages/db"
    schedule:
      interval: "weekly"
    groups:
      db:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/marketing/x"
    schedule:
      interval: "weekly"
    groups:
      marketing-x:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/etl"
    schedule:
      interval: "weekly"
    groups:
      etl:
        patterns:
          - "*"

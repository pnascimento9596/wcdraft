name: Production database migration

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character origin/main SHA approved for migration
        required: true
        type: string
      expected_pending_migration:
        description: Exact single journal-tail migration expected to be pending
        required: true
        default: 0012_ranked_attempt_structural_binding
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: exact main · primary Neon · migrate · verify
    if: >-
      github.repository == 'pnascimento9596/wcdraft' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, macOS, ARM64, wcdraft]
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
      EXPECTED_PENDING_MIGRATION: ${{ inputs.expected_pending_migration }}
    steps:
      - name: Guard dispatch envelope before checkout
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          receipt_dir="$RUNNER_TEMP/wcdraft-production-migration-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$receipt_dir"
          echo "RECEIPT_DIR=$receipt_dir" >>"$GITHUB_ENV"
          if [[ ! "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_main_sha must be an exact lowercase 40-character commit SHA"
            exit 1
          fi
          if [[ ! "$EXPECTED_PENDING_MIGRATION" =~ ^[0-9]{4}_[a-z0-9_]+$ ]]; then
            echo "::error::expected_pending_migration is malformed"
            exit 1
          fi
          if [[ "$GITHUB_REPOSITORY" != "pnascimento9596/wcdraft" || "$GITHUB_EVENT_NAME" != "workflow_dispatch" || "$GITHUB_REF" != "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            echo "::error::production migration dispatch is restricted to the repository default branch"
            exit 1
          fi

      - name: Checkout default branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare persistent runner
        uses: ./.github/actions/self-hosted-runner-hygiene

      - name: Bind checkout and remote main to approved SHA
        shell: bash
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          event_sha="$GITHUB_SHA"
          remote_sha="$(git ls-remote --exit-code origin "refs/heads/${{ github.event.repository.default_branch }}" | awk 'NR == 1 { print $1 }')"
          if [[ "$checkout_sha" != "$EXPECTED_MAIN_SHA" || "$event_sha" != "$EXPECTED_MAIN_SHA" || "$remote_sha" != "$EXPECTED_MAIN_SHA" ]]; then
            echo "::error::approved SHA, event SHA, checkout SHA, and current remote default-branch SHA must match exactly"
            exit 1
          fi
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            echo "::error::migration checkout is not clean"
            exit 1
          fi
          echo "dispatch SHA binding: PASS ($EXPECTED_MAIN_SHA)"

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          dest: ${{ runner.tool_cache }}/pnpm-11.5.1
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve exact journal tail
        id: journal
        shell: bash
        run: |
          set -euo pipefail
          journal_json="packages/db/migrations/meta/_journal.json"
          values="$(node -e '
            const fs = require("node:fs");
            const journal = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const entries = journal.entries;
            if (!Array.isArray(entries) || entries.length === 0) throw new Error("empty migration journal");
            entries.forEach((entry, index) => {
              if (entry.idx !== index) throw new Error("migration journal is not contiguous");
            });
            const tail = entries.at(-1);
            process.stdout.write(`${tail.idx}\t${tail.tag}\t${entries.length}`);
          ' "$journal_json")"
          IFS=$'\t' read -r expected_index journal_tail expected_total <<<"$values"
          if [[ "$journal_tail" != "$EXPECTED_PENDING_MIGRATION" ]]; then
            echo "::error::caller-supplied migration is not the exact checked-out journal tail"
            exit 1
          fi
          {
            echo "expected_index=$expected_index"
            echo "expected_total=$expected_total"
          } >>"$GITHUB_OUTPUT"
          echo "journal tail binding: PASS (index=$expected_index total=$expected_total)"

      - name: Resolve unique Neon primary direct connection
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$NEON_API_KEY"
          test -n "$NEON_PROJECT_ID"
          mkdir -p "$RECEIPT_DIR"
          export CONNECTION_FILE="$RECEIPT_DIR/direct-url"
          echo "::add-mask::$NEON_API_KEY"
          echo "::add-mask::$NEON_PROJECT_ID"
          node <<'NODE'
          const fs = require("node:fs");
          const api = "https://console.neon.tech/api/v2";
          const apiKey = process.env.NEON_API_KEY.trim();
          const projectId = process.env.NEON_PROJECT_ID.trim();
          const connectionFile = process.env.CONNECTION_FILE;

          async function request(path) {
            const response = await fetch(`${api}${path}`, {
              headers: { Authorization: `Bearer ${apiKey}`, Accept: "application/json" },
            });
            if (!response.ok) throw new Error(`Neon API request failed with HTTP ${response.status}`);
            return response.json();
          }

          const encodedProject = encodeURIComponent(projectId);
          const branchPayload = await request(`/projects/${encodedProject}/branches`);
          const branches = Array.isArray(branchPayload.branches) ? branchPayload.branches : [];
          const primaryCandidates = branches.filter((branch) => branch.default === true || branch.primary === true);
          if (primaryCandidates.length !== 1) {
            throw new Error(`refusing primary/default ambiguity: found ${primaryCandidates.length} flagged branches`);
          }
          const primary = primaryCandidates[0];
          const endpointsPayload = await request(`/projects/${encodedProject}/endpoints`);
          const endpoints = Array.isArray(endpointsPayload.endpoints) ? endpointsPayload.endpoints : [];
          const readWrite = endpoints.filter(
            (endpoint) => endpoint.branch_id === primary.id && endpoint.type === "read_write",
          );
          if (readWrite.length !== 1) {
            throw new Error(`refusing read_write endpoint ambiguity: found ${readWrite.length} on primary`);
          }
          const role = primary.default_role_name;
          if (typeof role !== "string" || role.length === 0) throw new Error("primary default role is absent");
          const query = new URLSearchParams({
            branch_id: primary.id,
            database_name: "neondb",
            role_name: role,
            pooled: "false",
          });
          const connectionPayload = await request(`/projects/${encodedProject}/connection_uri?${query}`);
          const uri = connectionPayload.uri;
          if (typeof uri !== "string" || uri.length === 0) throw new Error("Neon returned an empty connection URI");
          const parsed = new URL(uri);
          if (!/^postgres(?:ql)?:$/.test(parsed.protocol) || !parsed.hostname.endsWith(".neon.tech") || parsed.hostname.includes("-pooler.")) {
            throw new Error("Neon connection is not an unpooled direct Neon PostgreSQL endpoint");
          }
          fs.writeFileSync(connectionFile, uri, { mode: 0o600, flag: "wx" });
          NODE
          direct_url="$(cat "$CONNECTION_FILE")"
          echo "::add-mask::$direct_url"
          echo "Neon target binding: PASS (one flagged primary/default; one direct read_write endpoint)"

      - name: Exact known-pending preflight
        env:
          EXPECTED_INDEX: ${{ steps.journal.outputs.expected_index }}
          EXPECTED_TOTAL: ${{ steps.journal.outputs.expected_total }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DATABASE_URL_UNPOOLED="$(cat "$RECEIPT_DIR/direct-url")"
          pre_receipt="$RECEIPT_DIR/status-before.txt"
          set +e
          pnpm --filter @wcdraft/db db:migrate:status >"$pre_receipt" 2>&1
          status_rc=$?
          set -e
          scripts/ci/classify-production-migration-status.sh pre \
            "$pre_receipt" "$status_rc" "$EXPECTED_INDEX" \
            "$EXPECTED_PENDING_MIGRATION" "$EXPECTED_TOTAL"

      - name: Apply exact checked-out migrations
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DATABASE_URL_UNPOOLED="$(cat "$RECEIPT_DIR/direct-url")"
          migrate_receipt="$RECEIPT_DIR/migrate.txt"
          set +e
          pnpm --filter @wcdraft/db db:migrate >"$migrate_receipt" 2>&1
          migrate_rc=$?
          set -e
          if [[ "$migrate_rc" -ne 0 ]]; then
            echo "::error::migration failed; raw protected receipt was not printed"
            exit 1
          fi
          echo "migration command: PASS"

      - name: Exact post-migration status
        env:
          EXPECTED_INDEX: ${{ steps.journal.outputs.expected_index }}
          EXPECTED_TOTAL: ${{ steps.journal.outputs.expected_total }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export DATABASE_URL_UNPOOLED="$(cat "$RECEIPT_DIR/direct-url")"
          post_receipt="$RECEIPT_DIR/status-after.txt"
          set +e
          pnpm --filter @wcdraft/db db:migrate:status >"$post_receipt" 2>&1
          status_rc=$?
          set -e
          scripts/ci/classify-production-migration-status.sh post \
            "$post_receipt" "$status_rc" "$EXPECTED_INDEX" \
            "$EXPECTED_PENDING_MIGRATION" "$EXPECTED_TOTAL"
          {
            echo "### Production DB migration receipt"
            echo
            echo "- Commit: \`$EXPECTED_MAIN_SHA\`"
            echo "- Migration: \`$EXPECTED_PENDING_MIGRATION\`"
            echo "- Result: exact journal head; pending=0"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Scrub connection and protected receipts
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          unset DATABASE_URL_UNPOOLED NEON_API_KEY NEON_PROJECT_ID
          if [[ -n "${RECEIPT_DIR:-}" ]]; then
            rm -rf -- "$RECEIPT_DIR"
            test ! -e "$RECEIPT_DIR"
          fi

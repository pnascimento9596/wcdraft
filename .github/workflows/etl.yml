name: ETL

# Triggered on `main` AND the same integration-branch family CI watches
# (engine-*, merit-*, season-*, season/**). The merit-v2 series shipped CI-dark
# because the triggers were main-only; widening here keeps the ETL gate
# (ingest · identity-QA · determinism) honest on every long-lived
# integration branch and brings the two workflows back into agreement.
on:
  pull_request:
    branches: [main, "engine-*", "merit-*", "season-*", "season/**"]
    paths: ["etl/**", ".github/**", "turbo.json"]
  push:
    branches: [main, "engine-*", "merit-*", "season-*", "season/**"]
    paths: ["etl/**", ".github/**", "turbo.json"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: etl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned upstream revision the ETL is built and validated against.
  WORLDCUP_COMMIT: f41e9437a007498bdbf3751305818101f96cb6fb
  WCDRAFT_WORLDCUP_DIR: etl/vendor/worldcup/data-csv

jobs:
  changes:
    name: changes · ETL path detector
    runs-on: [self-hosted, wcdraft-linux]
    if: ${{ github.actor != 'dependabot[bot]' }}
    outputs:
      ci_config: ${{ steps.filter.outputs.ci_config }}
      etl: ${{ steps.filter.outputs.etl }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare persistent runner
        uses: ./.github/actions/self-hosted-runner-hygiene

      - name: Detect ETL-affecting changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            ci_config:
              - '.github/**'
              - 'turbo.json'
            etl:
              - 'etl/**'

  etl:
    name: ingest · identity-QA · determinism
    runs-on: [self-hosted, wcdraft-linux]
    needs: changes
    if: ${{ needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.etl == 'true' }}
    env:
      UV_PYTHON: "3.12"
    defaults:
      run:
        working-directory: etl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Prepare persistent runner
        uses: ./.github/actions/self-hosted-runner-hygiene

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup Python
        run: uv python install "$UV_PYTHON"

      - name: Clone pinned Fjelstul World Cup Database (CC-BY-SA 4.0)
        run: |
          git clone --filter=blob:none https://github.com/jfjelstul/worldcup vendor/worldcup
          git -C vendor/worldcup checkout "$WORLDCUP_COMMIT"

      - name: Assert Fjelstul checkout matches pin
        run: |
          actual="$(git -C vendor/worldcup rev-parse HEAD)"
          if [ "$actual" != "$WORLDCUP_COMMIT" ]; then
            echo "::error::Fjelstul worldcup checkout drifted: expected $WORLDCUP_COMMIT, got $actual" >&2
            exit 1
          fi

      - name: Install ETL package (+ dev tools)
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Verify RSSSF supplement snapshots (sha256 vs fetch manifest)
        # No network: recomputes the committed raw snapshot hashes and fails if
        # any drift from supplement/fetch_manifest.json, proving the sourced
        # appearances were parsed from exactly the pinned public bytes.
        run: uv run python -m wcdraft_etl.supplement.fetch --verify

      - name: Run ETL pipeline
        # Pipeline writes to etl/output relative to the repo root, so run from there.
        working-directory: ${{ github.workspace }}
        run: uv run --project etl python -m wcdraft_etl

      - name: Determinism + artifacts current (no diff after rebuild)
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- etl/output; then
            echo "::error::etl/output changed after a clean rebuild — committed artifacts are stale or the build is non-deterministic. Run 'python -m wcdraft_etl' and commit." >&2
            exit 1
          fi

      - name: Run historical rating stage
        # ratings.json is regenerated, not tracked; ratings.lock.json is the
        # tracked deterministic fingerprint that must remain byte-stable.
        working-directory: ${{ github.workspace }}
        run: uv run --project etl python -m wcdraft_etl.rating

      - name: Historical rating determinism lock current
        working-directory: ${{ github.workspace }}
        run: |
          sha256sum etl/output/ratings.lock.json | grep -F 'bf4b75e58b8642833a863986d9191d739f3d2b652c0159e3014c005aaf09400c'
          if ! git diff --exit-code -- etl/output/ratings.lock.json; then
            echo "::error::etl/output/ratings.lock.json changed after a clean rebuild — run 'python -m wcdraft_etl.rating' and commit the lockfile." >&2
            exit 1
          fi

      - name: Run 2026 ingest (offline — pinned Wikipedia snapshots, no network)
        # Reads the committed canonical tables (just regenerated) + the pinned
        # CC-BY-SA Wikipedia snapshots in etl/sources/wikipedia_2026/.
        working-directory: ${{ github.workspace }}
        run: uv run --project etl python -m wcdraft_etl.ingest_2026

      - name: 2026 determinism + artifacts current (no diff after rebuild)
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- etl/output; then
            echo "::error::2026 etl/output changed after a clean rebuild — committed *_2026.json are stale or the build is non-deterministic. Run 'python -m wcdraft_etl.ingest_2026' and commit." >&2
            exit 1
          fi

      - name: Identity-QA + rating + 2026 determinism tests
        run: uv run python -m pytest -q

  rating-lock-matrix:
    name: rating lock · Python ${{ matrix.python-version }}
    runs-on: [self-hosted, wcdraft-linux]
    needs: changes
    if: ${{ (github.event_name == 'pull_request' && needs.changes.outputs.ci_config == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.etl == 'true')) }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true
          persist-credentials: false

      - name: Prepare persistent runner
        uses: ./.github/actions/self-hosted-runner-hygiene

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Setup Python
        run: uv python install "$UV_PYTHON"

      - name: Install ETL package (+ dev tools)
        run: uv sync --locked --extra dev
        working-directory: etl

      - name: Golden determinism — ratings lockfile must be byte-stable
        run: |
          uv run --project etl python -m wcdraft_etl.rating
          sha256sum etl/output/ratings.lock.json | grep -F 'bf4b75e58b8642833a863986d9191d739f3d2b652c0159e3014c005aaf09400c'
          git diff --exit-code -- etl/output/ratings.lock.json \
            || (echo "::error::etl/output/ratings.lock.json changed on Python ${{ matrix.python-version }}." >&2 && exit 1)

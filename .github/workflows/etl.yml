name: ETL

# Triggered on `main` AND the same integration-branch family CI watches
# (engine-*, merit-*, season-*). The merit-v2 series shipped CI-dark
# because the triggers were main-only; widening here keeps the ETL gate
# (ingest · identity-QA · determinism) honest on every long-lived
# integration branch and brings the two workflows back into agreement.
on:
  pull_request:
    branches: [main, "engine-*", "merit-*", "season-*"]
    paths: ["etl/**", ".github/workflows/etl.yml"]
  push:
    branches: [main, "engine-*", "merit-*", "season-*"]
    paths: ["etl/**", ".github/workflows/etl.yml"]

permissions:
  contents: read

concurrency:
  group: etl-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned upstream revision the ETL is built and validated against.
  WORLDCUP_COMMIT: f41e9437a007498bdbf3751305818101f96cb6fb
  WCDRAFT_WORLDCUP_DIR: etl/vendor/worldcup/data-csv

jobs:
  etl:
    name: ingest · identity-QA · determinism
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone pinned Fjelstul World Cup Database (CC-BY-SA 4.0)
        run: |
          git clone --filter=blob:none https://github.com/jfjelstul/worldcup vendor/worldcup
          git -C vendor/worldcup checkout "$WORLDCUP_COMMIT"

      - name: Install ETL package (+ dev tools)
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Verify RSSSF supplement snapshots (sha256 vs fetch manifest)
        # No network: recomputes the committed raw snapshot hashes and fails if
        # any drift from supplement/fetch_manifest.json, proving the sourced
        # appearances were parsed from exactly the pinned public bytes.
        run: python -m wcdraft_etl.supplement.fetch --verify

      - name: Run ETL pipeline
        # Pipeline writes to etl/output relative to the repo root, so run from there.
        working-directory: ${{ github.workspace }}
        run: python -m wcdraft_etl

      - name: Determinism + artifacts current (no diff after rebuild)
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- etl/output; then
            echo "::error::etl/output changed after a clean rebuild — committed artifacts are stale or the build is non-deterministic. Run 'python -m wcdraft_etl' and commit." >&2
            exit 1
          fi

      - name: Run 2026 ingest (offline — pinned Wikipedia snapshots, no network)
        # Reads the committed canonical tables (just regenerated) + the pinned
        # CC-BY-SA Wikipedia snapshots in etl/sources/wikipedia_2026/.
        working-directory: ${{ github.workspace }}
        run: python -m wcdraft_etl.ingest_2026

      - name: 2026 determinism + artifacts current (no diff after rebuild)
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- etl/output; then
            echo "::error::2026 etl/output changed after a clean rebuild — committed *_2026.json are stale or the build is non-deterministic. Run 'python -m wcdraft_etl.ingest_2026' and commit." >&2
            exit 1
          fi

      - name: Identity-QA + rating + 2026 determinism tests
        run: python -m pytest -q

name: CI

# Triggered on `main` AND every long-lived integration branch (engine-*,
# merit-*, leaderboard-profiles and the placeholder season-* family). Before the merit-v2 season
# merge the workflow only ran for `main`-targeted PRs, so the entire
# `engine-v2`/`merit-v2` series shipped CI-dark — a structural risk the
# post-season gate review flagged. Listing the integration prefixes here
# makes every PR into one of those branches run the same gate as a
# PR into main; new integration branches MUST follow the same naming.
on:
  pull_request:
    branches: [main, "engine-*", "merit-*", "leaderboard-profiles", "season-*"]
  push:
    branches: [main, "engine-*", "merit-*", "leaderboard-profiles", "season-*"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes · path detector
    runs-on: ubuntu-latest
    outputs:
      ci_config: ${{ steps.filter.outputs.ci_config }}
      js: ${{ steps.filter.outputs.js }}
      core_data: ${{ steps.filter.outputs.core_data }}
      db: ${{ steps.filter.outputs.db }}
      etl: ${{ steps.filter.outputs.etl }}
      source: ${{ steps.filter.outputs.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Detect CI-affecting changes
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          filters: |
            ci_config:
              - '.github/**'
              - 'turbo.json'
            js:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc.json'
              - 'etl/output/**'
            core_data:
              - 'packages/core/**'
              - 'packages/data/**'
              - 'etl/output/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            db:
              - 'packages/db/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            etl:
              - 'etl/**'
            source:
              - 'apps/**'
              - 'packages/**'
              - 'etl/**'
              - 'scripts/**'
              - '.github/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'eslint.config.mjs'
              - '.prettierrc.json'

  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.js == 'true' }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generated data determinism
        run: pnpm run check:generated

      - name: Agent contract drift check
        run: pnpm run check:agent-contracts

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  golden:
    name: golden RNG determinism
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.js == 'true' }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Golden RNG test (fixed seed → recorded sequence)
        # Routed through Turbo so the task is cache-aware and uses the same
        # pipeline as every other check. Path-selected (src/rng.golden.test.ts)
        # with passWithNoTests:false — fails if the file is missing or drifts.
        run: pnpm exec turbo run test:golden --filter=@wcdraft/core

      - name: Golden DRAFT determinism (17-spin sequence · dedup · lock-on-pick · compatibility)
        # Path-selected WS-C golden suites with passWithNoTests:false — fails if
        # the deterministic 17-spin output drifts from the recorded snapshot.
        run: pnpm exec turbo run test:golden:draft --filter=@wcdraft/core

      - name: Golden DATA determinism + integration
        run: pnpm exec turbo run test:golden:data test:golden:integration --filter=@wcdraft/data

      - name: Golden WEB leaderboard determinism
        run: pnpm exec turbo run test:golden:leaderboard --filter=@wcdraft/web

  realism:
    name: realism · asymmetric gate (N=2000 × 3 policies)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.ci_config == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.core_data == 'true') }}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Asymmetric realism gate (heavy — split OFF the default test job)
        # The N=2000 × 3-policy ensemble is deliberately OFF the default
        # `verify` job's `pnpm run test` to keep fast feedback fast. It still
        # runs for CI-config PRs, relevant main merges, and the nightly heavy
        # workflow. Each policy shard runs in its own process on the same
        # runner, preserving seed ranges while using available cores.
        env:
          WCDRAFT_REALISM_HEAVY: "1"
        run: |
          set -euo pipefail
          node packages/data/scripts/ensure-generated-artifacts.mjs

          policies=(autoDraft strategicAutoDraft greedyOverallAutoDraft)
          pids=()
          for policy in "${policies[@]}"; do
            (
              export WCDRAFT_REALISM_POLICY="$policy"
              pnpm --filter @wcdraft/data exec vitest run test/realism/realism.gate.test.ts
            ) > "$RUNNER_TEMP/realism-$policy.log" 2>&1 &
            pids+=("$!")
          done

          failed=0
          for i in "${!policies[@]}"; do
            policy="${policies[$i]}"
            pid="${pids[$i]}"
            if ! wait "$pid"; then
              echo "::error::realism policy shard failed: $policy"
              failed=1
            fi
            sed "s/^/[${policy}] /" "$RUNNER_TEMP/realism-$policy.log"
          done
          exit "$failed"

  etl:
    name: ingest · identity-QA · determinism
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.etl == 'true' }}
    env:
      WORLDCUP_COMMIT: f41e9437a007498bdbf3751305818101f96cb6fb
      WCDRAFT_WORLDCUP_DIR: etl/vendor/worldcup/data-csv
    defaults:
      run:
        working-directory: etl
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Clone pinned Fjelstul World Cup Database (CC-BY-SA 4.0)
        run: |
          git clone --filter=blob:none https://github.com/jfjelstul/worldcup vendor/worldcup
          git -C vendor/worldcup checkout "$WORLDCUP_COMMIT"

      - name: Assert Fjelstul checkout matches pin
        run: |
          actual="$(git -C vendor/worldcup rev-parse HEAD)"
          if [ "$actual" != "$WORLDCUP_COMMIT" ]; then
            echo "::error::Fjelstul worldcup checkout drifted: expected $WORLDCUP_COMMIT, got $actual" >&2
            exit 1
          fi

      - name: Install ETL package (+ dev tools)
        run: uv sync --locked --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Verify RSSSF supplement snapshots (sha256 vs fetch manifest)
        run: uv run python -m wcdraft_etl.supplement.fetch --verify

      - name: Run ETL pipeline
        working-directory: ${{ github.workspace }}
        run: uv run --project etl python -m wcdraft_etl

      - name: Determinism + artifacts current (no diff after rebuild)
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- etl/output; then
            echo "::error::etl/output changed after a clean rebuild — committed artifacts are stale or the build is non-deterministic. Run 'python -m wcdraft_etl' and commit." >&2
            exit 1
          fi

      - name: Run historical rating stage
        working-directory: ${{ github.workspace }}
        run: uv run --project etl python -m wcdraft_etl.rating

      - name: Historical rating determinism lock current
        working-directory: ${{ github.workspace }}
        run: |
          sha256sum etl/output/ratings.lock.json | grep -F '1084f74194c7d46c66892f4d0328d3d90a728a8cec43956564cffd2ec651f0a0'
          if ! git diff --exit-code -- etl/output/ratings.lock.json; then
            echo "::error::etl/output/ratings.lock.json changed after a clean rebuild — run 'python -m wcdraft_etl.rating' and commit the lockfile." >&2
            exit 1
          fi

      - name: Run 2026 ingest (offline — pinned Wikipedia snapshots, no network)
        working-directory: ${{ github.workspace }}
        run: uv run --project etl python -m wcdraft_etl.ingest_2026

      - name: 2026 determinism + artifacts current (no diff after rebuild)
        working-directory: ${{ github.workspace }}
        run: |
          if ! git diff --exit-code -- etl/output; then
            echo "::error::2026 etl/output changed after a clean rebuild — committed *_2026.json are stale or the build is non-deterministic. Run 'python -m wcdraft_etl.ingest_2026' and commit." >&2
            exit 1
          fi

      - name: Identity-QA + rating + 2026 determinism tests
        run: uv run python -m pytest -q

  db-rollback-check:
    name: db · ephemeral branch · apply → anon-dedupe → rollback round-trip
    runs-on: ubuntu-latest
    needs: changes
    # The destructive ephemeral-branch rollback-check is heavy (forks + tears
    # down a Neon branch) and only meaningful when @wcdraft/db, package
    # resolution, or CI config changes. Other PRs skip it and rely on the
    # aggregate check to report success.
    if: ${{ needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.db == 'true' }}
    # SAFETY POSTURE (revised per independent review on PR #26):
    # This job NO LONGER takes a static DATABASE_URL_UNPOOLED secret. Instead
    # it creates its OWN ephemeral Neon branch off the primary, runs the
    # round-trip against THAT, and deletes the branch in always() — so a
    # misconfigured secret can NEVER target production.
    #
    # Skips with a warning when NEON_API_KEY or NEON_PROJECT_ID is absent
    # (fork PRs don't get secrets; this keeps their CI green).
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate — require Neon API key + project id
        id: gate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        # Emits skip=true (with a workflow warning, not a failure) when
        # either secret is missing — contributors on forks don't have them
        # and we don't want their CI to red over an integration-only job.
        # Also prints LENGTH diagnostics so any future secret-storage drift
        # is immediately visible in the run log (the values themselves stay
        # masked by GitHub Actions' secret scrubber).
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::NEON_API_KEY or NEON_PROJECT_ID secret is not set — skipping ephemeral-branch rollback-check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[gate] NEON_API_KEY length=${#NEON_API_KEY} NEON_PROJECT_ID length=${#NEON_PROJECT_ID}"
          fi

      - name: Create ephemeral Neon branch
        id: branch_create
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        # The script writes the branch's pooled + unpooled URLs (and
        # NEON_EPHEMERAL_BRANCH_ID + NEON_PROJECT_ID) to $RUNNER_TEMP/neon-ephemeral.env
        # at mode 0600, and emits the branch_id + project_id to GITHUB_OUTPUT
        # so the always() cleanup step can find them.
        run: pnpm --filter @wcdraft/db db:branch:create "$RUNNER_TEMP/neon-ephemeral.env"

      - name: Apply migrations against ephemeral branch
        if: ${{ steps.gate.outputs.skip != 'true' && steps.branch_create.outcome == 'success' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -a
          . "$RUNNER_TEMP/neon-ephemeral.env"
          set +a
          pnpm --filter @wcdraft/db db:migrate

      - name: Migration status (read-only)
        if: ${{ steps.gate.outputs.skip != 'true' && steps.branch_create.outcome == 'success' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -a
          . "$RUNNER_TEMP/neon-ephemeral.env"
          set +a
          pnpm --filter @wcdraft/db db:migrate:status

      - name: Rollback-check (apply → anon-dedupe → rollback → assert empty)
        if: ${{ steps.gate.outputs.skip != 'true' && steps.branch_create.outcome == 'success' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        # The runner's in-script guard checks NEON_EPHEMERAL_BRANCH_ID is set
        # AND (when NEON_API_KEY is present) that the branch is NOT primary/default.
        # A misconfigured workflow that pointed at production would be caught here.
        run: |
          set -a
          . "$RUNNER_TEMP/neon-ephemeral.env"
          set +a
          pnpm --filter @wcdraft/db db:rollback-check

      - name: Delete ephemeral Neon branch (always)
        if: ${{ always() && steps.branch_create.outputs.branch_id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ steps.branch_create.outputs.project_id }}
          NEON_EPHEMERAL_BRANCH_ID: ${{ steps.branch_create.outputs.branch_id }}
        # always() ensures the branch is destroyed even if migrate or
        # rollback-check failed mid-run. The delete script ALSO refuses to
        # delete a primary/default branch as a final safety check.
        run: pnpm --filter @wcdraft/db db:branch:delete

  etl-rating:
    name: ETL rating · lint · golden determinism
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.etl == 'true' }}
    # Self-contained: the rating stage reads the COMMITTED canonical JSON in
    # etl/output/, so this job needs no upstream Fjelstul CSV clone. It lints the
    # rating code, runs the rating test suite, and proves byte-determinism by
    # regenerating ratings.json and failing if the tracked lockfile drifts.
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install ETL package (+ dev tools)
        run: uv sync --locked --extra dev
        working-directory: etl

      - name: Lint (ruff)
        working-directory: etl
        run: uv run ruff check src tests

      - name: Rating tests (determinism · honest-state · sanity)
        working-directory: etl
        run: uv run python -m pytest tests/test_rating.py -q

      - name: Golden determinism — ratings lockfile must be byte-stable
        run: |
          uv run --project etl python -m wcdraft_etl.rating
          sha256sum etl/output/ratings.lock.json | grep -F '1084f74194c7d46c66892f4d0328d3d90a728a8cec43956564cffd2ec651f0a0'
          git diff --exit-code -- etl/output/ratings.lock.json \
            || (echo "::error::etl/output/ratings.lock.json is stale — run 'python -m wcdraft_etl.rating' and commit the lockfile." && exit 1)

  gitleaks:
    name: secrets · incremental scan
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.ci_config == 'true' || needs.changes.outputs.source == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Gitleaks incremental scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aggregate:
    name: required · aggregate gates
    runs-on: ubuntu-latest
    needs:
      - changes
      - verify
      - golden
      - realism
      - etl
      - db-rollback-check
      - etl-rating
      - gitleaks
    if: ${{ always() }}
    steps:
      - name: Fail if any needed gate failed or cancelled
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          GOLDEN_RESULT: ${{ needs.golden.result }}
          REALISM_RESULT: ${{ needs.realism.result }}
          ETL_RESULT: ${{ needs.etl.result }}
          DB_RESULT: ${{ needs.db-rollback-check.result }}
          ETL_RATING_RESULT: ${{ needs.etl-rating.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          set -euo pipefail
          failed=0
          check_result() {
            name="$1"
            result="$2"
            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              failure|cancelled)
                echo "::error::$name result=$result"
                failed=1
                ;;
              *)
                echo "::error::$name unexpected result=$result"
                failed=1
                ;;
            esac
          }

          check_result "changes · path detector" "$CHANGES_RESULT"
          check_result "typecheck · lint · test · build" "$VERIFY_RESULT"
          check_result "golden RNG determinism" "$GOLDEN_RESULT"
          check_result "realism · asymmetric gate (N=2000 × 3 policies)" "$REALISM_RESULT"
          check_result "ingest · identity-QA · determinism" "$ETL_RESULT"
          check_result "db · ephemeral branch · apply → anon-dedupe → rollback round-trip" "$DB_RESULT"
          check_result "ETL rating · lint · golden determinism" "$ETL_RATING_RESULT"
          check_result "secrets · incremental scan" "$GITLEAKS_RESULT"
          exit "$failed"

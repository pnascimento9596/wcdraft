name: CI

# Triggered on `main` AND every long-lived integration branch (engine-*,
# merit-* and the placeholder season-* family). Before the merit-v2 season
# merge the workflow only ran for `main`-targeted PRs, so the entire
# `engine-v2`/`merit-v2` series shipped CI-dark — a structural risk the
# post-season gate review flagged. Listing the integration prefixes here
# makes every PR into one of those branches run the same gate as a
# PR into main; new integration branches MUST follow the same naming.
on:
  pull_request:
    branches: [main, "engine-*", "merit-*", "season-*"]
  push:
    branches: [main, "engine-*", "merit-*", "season-*"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dedupe gate (q-008) ────────────────────────────────────────────────────
  #
  # A push to an integration branch (merit-*, engine-*, season-*) that ALSO has
  # an open PR fires BOTH a push run and a pull_request run on the same head
  # SHA. This gate skips the push-event duplicate when an open PR with this
  # branch as head exists — the pull_request run (the one branch protection
  # reads) always proceeds, so no gate is weakened; only the redundant trigger
  # is dropped. pull_request events and pushes to main (which never have an
  # open PR with head=main) always emit run=true.
  dedupe:
    name: dedupe · skip push run when an open PR covers this head
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check for an open PR with this branch as head
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prs=$(gh api "repos/${{ github.repository }}/pulls?state=open&head=${{ github.repository_owner }}:${GITHUB_REF_NAME}" --jq 'length')
          if [ "$prs" -gt 0 ]; then
            echo "::notice::Open PR exists for ${GITHUB_REF_NAME} — skipping duplicate push run (the pull_request run covers this head)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    needs: dedupe
    if: ${{ needs.dedupe.outputs.run == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  golden:
    name: golden RNG determinism
    runs-on: ubuntu-latest
    needs: dedupe
    if: ${{ needs.dedupe.outputs.run == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Golden RNG test (fixed seed → recorded sequence)
        # Routed through Turbo so the task is cache-aware and uses the same
        # pipeline as every other check. Path-selected (src/rng.golden.test.ts)
        # with passWithNoTests:false — fails if the file is missing or drifts.
        run: pnpm exec turbo run test:golden --filter=@wcdraft/core

      - name: Golden DRAFT determinism (17-spin sequence · dedup · lock-on-pick · compatibility)
        # Path-selected WS-C golden suites with passWithNoTests:false — fails if
        # the deterministic 17-spin output drifts from the recorded snapshot.
        run: pnpm exec turbo run test:golden:draft --filter=@wcdraft/core

  realism:
    name: realism · asymmetric gate (N=2000 × 3 policies)
    runs-on: ubuntu-latest
    needs: dedupe
    if: ${{ needs.dedupe.outputs.run == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Asymmetric realism gate (heavy — split OFF the default test job)
        # The N=2000 × 3-policy ensemble (~1 min) is deliberately OFF the
        # `verify` job's `pnpm run test` to keep fast feedback fast. It is NOT
        # dropped — it gates every PR here. The fast SYMMETRIC coherent-XI
        # sweep (realism-modern-norms.golden.test.ts) stays on the default
        # job. WCDRAFT_REALISM_HEAVY=1 flips realism.gate.test.ts from
        # describe.skip to live; the Turbo task declares the var in its env so
        # this run never shares a cache entry with the default test job.
        env:
          WCDRAFT_REALISM_HEAVY: "1"
        run: pnpm exec turbo run test:realism:heavy --filter=@wcdraft/data

  # ── Path-filter gate for the db job ──────────────────────────────────────
  #
  # The destructive ephemeral-branch rollback-check is heavy (forks + tears
  # down a Neon branch on every run) and only meaningful when something in
  # @wcdraft/db's surface changes. This gate emits run=true only when the PR
  # diff (or push) touches packages/db, the workflow itself, the lockfile,
  # or turbo.json (which carries the env: registrations the job depends on).
  # Other PRs skip the db job entirely.
  db-gate:
    name: db · path filter
    runs-on: ubuntu-latest
    needs: dedupe
    if: ${{ needs.dedupe.outputs.run == 'true' }}
    outputs:
      run: ${{ steps.filter.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Detect DB-affecting changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            db:
              - 'packages/db/**'
              - '.github/workflows/ci.yml'
              - 'pnpm-lock.yaml'
              - 'turbo.json'

  db-rollback-check:
    name: db · ephemeral branch · apply → anon-dedupe → rollback round-trip
    runs-on: ubuntu-latest
    needs: db-gate
    # db-gate is itself behind the dedupe gate; a skipped db-gate emits no
    # outputs, so this `if` stays false on deduped push runs too.
    if: ${{ needs.db-gate.outputs.run == 'true' }}
    # SAFETY POSTURE (revised per independent review on PR #26):
    # This job NO LONGER takes a static DATABASE_URL_UNPOOLED secret. Instead
    # it creates its OWN ephemeral Neon branch off the primary, runs the
    # round-trip against THAT, and deletes the branch in always() — so a
    # misconfigured secret can NEVER target production.
    #
    # Skips with a warning when NEON_API_KEY or NEON_PROJECT_ID is absent
    # (fork PRs don't get secrets; this keeps their CI green).
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate — require Neon API key + project id
        id: gate
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        # Emits skip=true (with a workflow warning, not a failure) when
        # either secret is missing — contributors on forks don't have them
        # and we don't want their CI to red over an integration-only job.
        # Also prints LENGTH diagnostics so any future secret-storage drift
        # is immediately visible in the run log (the values themselves stay
        # masked by GitHub Actions' secret scrubber).
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::warning::NEON_API_KEY or NEON_PROJECT_ID secret is not set — skipping ephemeral-branch rollback-check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[gate] NEON_API_KEY length=${#NEON_API_KEY} NEON_PROJECT_ID length=${#NEON_PROJECT_ID}"
          fi

      - name: Create ephemeral Neon branch
        id: branch_create
        if: ${{ steps.gate.outputs.skip != 'true' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        # The script writes the branch's pooled + unpooled URLs (and
        # NEON_EPHEMERAL_BRANCH_ID + NEON_PROJECT_ID) to $RUNNER_TEMP/neon-ephemeral.env
        # at mode 0600, and emits the branch_id + project_id to GITHUB_OUTPUT
        # so the always() cleanup step can find them.
        run: pnpm --filter @wcdraft/db db:branch:create "$RUNNER_TEMP/neon-ephemeral.env"

      - name: Apply migrations against ephemeral branch
        if: ${{ steps.gate.outputs.skip != 'true' && steps.branch_create.outcome == 'success' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          set -a
          . "$RUNNER_TEMP/neon-ephemeral.env"
          set +a
          pnpm --filter @wcdraft/db db:migrate

      - name: Rollback-check (apply → anon-dedupe → rollback → assert empty)
        if: ${{ steps.gate.outputs.skip != 'true' && steps.branch_create.outcome == 'success' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        # The runner's in-script guard checks NEON_EPHEMERAL_BRANCH_ID is set
        # AND (when NEON_API_KEY is present) that the branch is NOT primary/default.
        # A misconfigured workflow that pointed at production would be caught here.
        run: |
          set -a
          . "$RUNNER_TEMP/neon-ephemeral.env"
          set +a
          pnpm --filter @wcdraft/db db:rollback-check

      - name: Delete ephemeral Neon branch (always)
        if: ${{ always() && steps.branch_create.outputs.branch_id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ steps.branch_create.outputs.project_id }}
          NEON_EPHEMERAL_BRANCH_ID: ${{ steps.branch_create.outputs.branch_id }}
        # always() ensures the branch is destroyed even if migrate or
        # rollback-check failed mid-run. The delete script ALSO refuses to
        # delete a primary/default branch as a final safety check.
        run: pnpm --filter @wcdraft/db db:branch:delete

  etl-rating:
    name: ETL rating · lint · golden determinism
    runs-on: ubuntu-latest
    needs: dedupe
    if: ${{ needs.dedupe.outputs.run == 'true' }}
    # Self-contained: the rating stage reads the COMMITTED canonical JSON in
    # etl/output/, so this job needs no upstream Fjelstul CSV clone. It lints the
    # rating code, runs the rating test suite, and proves byte-determinism by
    # regenerating ratings.json and failing on any git diff (the moat's guard).
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ETL package
        run: pip install -e './etl[dev]'

      - name: Lint (ruff)
        working-directory: etl
        run: ruff check src tests

      - name: Rating tests (determinism · honest-state · sanity)
        working-directory: etl
        run: python -m pytest tests/test_rating.py -q

      - name: Golden determinism — ratings.json must be byte-stable
        run: |
          python -m wcdraft_etl.rating
          git diff --exit-code -- etl/output/ratings.json \
            || (echo "::error::etl/output/ratings.json is stale — run 'python -m wcdraft_etl.rating' and commit." && exit 1)

      <stop offset=".35" stop-color="#f5b62a"/>
      <stop offset=".72" stop-color="#d28a0b"/>
      <stop offset="1" stop-color="#ffd774"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="26%" r="72%">
      <stop stop-color="#2ecf92" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2ecf92" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="medallion">
      <circle cx="512" cy="512" r="462"/>
    </clipPath>
  </defs>


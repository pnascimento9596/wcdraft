<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="wcdraft — draft your all-time XI">
  <style>
    @font-face{font-family:"Archivo";font-style:normal;font-weight:400;src:url("/fonts/archivo/archivo-latin-400-normal.woff2") format("woff2")}
    @font-face{font-family:"Archivo";font-style:normal;font-weight:500;src:url("/fonts/archivo/archivo-latin-500-normal.woff2") format("woff2")}
    @font-face{font-family:"Archivo";font-style:normal;font-weight:800;src:url("/fonts/archivo/archivo-latin-800-normal.woff2") format("woff2")}
    @font-face{font-family:"Archivo";font-style:normal;font-weight:900;src:url("/fonts/archivo/archivo-latin-900-normal.woff2") format("woff2")}
    :root{--font-family:"Archivo",sans-serif;--terrace-page:#0f100e;--terrace-card:#1a1d19;--terrace-green:#3f9268;--terrace-green-deep:#2f6d4d;--terrace-gold-start:#ac7e34;--terrace-gold:#d4a94e;--terrace-gold-end:#f1c15c;--terrace-ink:#ebe6da;--terrace-ink-mid:#c3c1b5;--terrace-ink-soft:#96968a;--terrace-ink-faint:#8a8b7f}
    svg,text,tspan{font-family:var(--font-family);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--terrace-card)"/>
      <stop offset="1" stop-color="var(--terrace-page)"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="var(--terrace-green)"/>
      <stop offset="1" stop-color="var(--terrace-green-deep)"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="var(--terrace-gold-start)"/>
      <stop offset="0.5" stop-color="var(--terrace-gold)"/>
      <stop offset="1" stop-color="var(--terrace-gold-end)"/>
    </linearGradient>
    <clipPath id="share-globe-clip">
      <circle cx="80" cy="80" r="43"/>
    </clipPath>
  </defs>

  <!-- Card background + emerald top border -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#emerald)"/>

  <!-- Brand mark: Concept A globe + orbiting pennants. -->
  <g transform="translate(82, 78) scale(1.34)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="80" cy="80" rx="62" ry="48" transform="rotate(-14 80 80)" stroke="#0a0e13" stroke-width="6"/>
      <ellipse cx="80" cy="80" rx="62" ry="48" transform="rotate(-14 80 80)" stroke="#2ecf92" stroke-width="2.5" stroke-dasharray="8 9"/>
    </g>
    <g stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(38 48) rotate(-30)">
        <path d="M0 2v-24" stroke="#0a0e13" stroke-width="5"/>
        <path d="M0 2v-24" stroke="#eef2f6" stroke-width="2.2"/>
        <path d="M0 -22 19 -16 0 -10Z" fill="#2ecf92" stroke="#0a0e13" stroke-width="3"/>
        <path d="M0 -22 19 -16 0 -10Z" fill="#2ecf92" stroke="#eef2f6" stroke-width="1.2"/>
      </g>
      <g transform="translate(119 37) rotate(24)">
        <path d="M0 2v-24" stroke="#0a0e13" stroke-width="5"/>
        <path d="M0 2v-24" stroke="#eef2f6" stroke-width="2.2"/>
        <path d="M0 -22 19 -16 0 -10Z" fill="#f5b62a" stroke="#0a0e13" stroke-width="3"/>
        <path d="M0 -22 19 -16 0 -10Z" fill="#f5b62a" stroke="#eef2f6" stroke-width="1.2"/>
      </g>
      <g transform="translate(133 100) rotate(82)">
        <path d="M0 2v-24" stroke="#0a0e13" stroke-width="5"/>
        <path d="M0 2v-24" stroke="#eef2f6" stroke-width="2.2"/>
        <path d="M0 -22 19 -16 0 -10Z" fill="#eef2f6" stroke="#0a0e13" stroke-width="3"/>
        <path d="M0 -22 19 -16 0 -10Z" fill="#eef2f6" stroke="#2ecf92" stroke-width="1.2"/>
      </g>
      <g transform="translate(36 113) rotate(-126)">
        <path d="M0 2v-24" stroke="#0a0e13" stroke-width="5"/>
        <path d="M0 2v-24" stroke="#eef2f6" stroke-width="2.2"/>
        <path d="M0 -22 19 -16 0 -10Z" fill="#2ecf92" stroke="#0a0e13" stroke-width="3"/>
        <path d="M0 -22 19 -16 0 -10Z" fill="#2ecf92" stroke="#f5b62a" stroke-width="1.2"/>
      </g>
    </g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="80" cy="80" r="43" stroke="#0a0e13" stroke-width="7"/>
      <circle cx="80" cy="80" r="43" stroke="#f5b62a" stroke-width="4"/>
    </g>
    <g clip-path="url(#share-globe-clip)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g stroke="#0a0e13" stroke-width="5">
        <ellipse cx="80" cy="80" rx="17" ry="43"/>
        <ellipse cx="80" cy="80" rx="43" ry="14"/>
        <path d="M47 56c17 11 49 11 66 0"/>
        <path d="M47 104c17-11 49-11 66 0"/>
        <path d="M80 66v-13M92 75l12-10M88 90l11 14M72 90l-11 14M68 75 56 65"/>
      </g>
      <g stroke="#f5b62a" stroke-width="2">
        <ellipse cx="80" cy="80" rx="17" ry="43"/>
        <ellipse cx="80" cy="80" rx="43" ry="14"/>
        <path d="M47 56c17 11 49 11 66 0" opacity=".64"/>
        <path d="M47 104c17-11 49-11 66 0" opacity=".64"/>
        <path d="M80 66v-13M92 75l12-10M88 90l11 14M72 90l-11 14M68 75 56 65" opacity=".72"/>
      </g>
    </g>
    <g clip-path="url(#share-globe-clip)" stroke-linejoin="round">
      <path d="M80 66 92.4 75 87.6 89.5 72.4 89.5 67.6 75Z" fill="#0a0e13" stroke="#0a0e13" stroke-width="6"/>
      <path d="M80 66 92.4 75 87.6 89.5 72.4 89.5 67.6 75Z" fill="#0a0e13" stroke="#f5b62a" stroke-width="2.4"/>
      <g opacity=".58">
        <g transform="translate(80 44) scale(.78 .5)">
          <path d="M0 -13 12.4 -4 7.6 10.5 -7.6 10.5 -12.4 -4Z" fill="#0a0e13" stroke="#0a0e13" stroke-width="6"/>
          <path d="M0 -13 12.4 -4 7.6 10.5 -7.6 10.5 -12.4 -4Z" fill="#0a0e13" stroke="#f5b62a" stroke-width="2.4"/>
        </g>
        <g transform="translate(113 61) rotate(28) scale(.7 .88)">
          <path d="M0 -13 12.4 -4 7.6 10.5 -7.6 10.5 -12.4 -4Z" fill="#0a0e13" stroke="#0a0e13" stroke-width="6"/>
          <path d="M0 -13 12.4 -4 7.6 10.5 -7.6 10.5 -12.4 -4Z" fill="#0a0e13" stroke="#f5b62a" stroke-width="2.4"/>
        </g>
        <g transform="translate(103 112) rotate(58) scale(.78 .58)">
          <path d="M0 -13 12.4 -4 7.6 10.5 -7.6 10.5 -12.4 -4Z" fill="#0a0e13" stroke="#0a0e13" stroke-width="6"/>
          <path d="M0 -13 12.4 -4 7.6 10.5 -7.6 10.5 -12.4 -4Z" fill="#0a0e13" stroke="#f5b62a" stroke-width="2.4"/>
        </g>
        <g transform="translate(57 112) rotate(-58) scale(.78 .58)">
          <path d="M0 -13 12.4 -4 7.6 10.5 -7.6 10.5 -12.4 -4Z" fill="#0a0e13" stroke="#0a0e13" stroke-width="6"/>
          <path d="M0 -13 12.4 -4 7.6 10.5 -7.6 10.5 -12.4 -4Z" fill="#0a0e13" stroke="#f5b62a" stroke-width="2.4"/>
        </g>
        <g transform="translate(47 61) rotate(-28) scale(.7 .88)">
          <path d="M0 -13 12.4 -4 7.6 10.5 -7.6 10.5 -12.4 -4Z" fill="#0a0e13" stroke="#0a0e13" stroke-width="6"/>
          <path d="M0 -13 12.4 -4 7.6 10.5 -7.6 10.5 -12.4 -4Z" fill="#0a0e13" stroke="#f5b62a" stroke-width="2.4"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="320" y="220" fill="var(--terrace-ink)" font-family="var(--font-family)" font-size="120" font-weight="900" letter-spacing="-0.035em">
    wc<tspan fill="url(#emerald)">draft</tspan>
  </text>

  <!-- Headline -->
  <text x="320" y="310" fill="var(--terrace-ink-soft)" font-family="var(--font-family)" font-size="36" font-weight="800" letter-spacing="-0.02em">
    DRAFT YOUR ALL-TIME XI
  </text>

  <!-- Sub-headline -->
  <text x="320" y="410" fill="var(--terrace-ink-mid)" font-family="var(--font-family)" font-size="34" font-weight="400">
    Spin · pick · lock the formation · chase the 8-0 run.
  </text>

  <!-- Footer line: domain + non-affiliation hint -->
  <text x="600" y="560" text-anchor="middle" fill="var(--terrace-ink-faint)" font-family="var(--font-family)" font-size="22" font-weight="500" letter-spacing="0.1em">
    WCDRAFT.APP · NAMES &amp; FLAG CODES ONLY
  </text>
</svg>

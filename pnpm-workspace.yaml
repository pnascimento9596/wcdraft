# pnpm workspace definition.
# NOTE: `etl/` is a Python project and is intentionally NOT a pnpm workspace member.
packages:
  - "apps/*"
  - "packages/*"
  # `marketing/x` — q-007 organic X poster. Self-contained workspace package
  # that reuses @wcdraft/core + @wcdraft/data; does NOT touch the web app.
  - "marketing/*"

# Pre-approved native build scripts (pnpm 10+ blocks postinstall by default),
# so installs are non-interactive and deterministic in CI:
#   sharp   — native image pipeline pulled in transitively by Next.js.
#   esbuild — native transform engine used by tsx (golden-fixture generator).
allowBuilds:
  esbuild: true
  sharp: true

overrides:
  postcss: ^8.5.10
